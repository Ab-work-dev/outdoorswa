services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outdoors
      POSTGRES_PASSWORD: outdoors_local_only
      POSTGRES_DB: outdoors_wa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - outdoors_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outdoors -d outdoors_wa"]
      interval: 5s
      retries: 10
volumes:
  outdoors_pgdata:
